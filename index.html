<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Recap · Open Library</title>
<!--
READING RECAP: a removable, 3-card share component for Open Library (prototype)
Card 1 = your progress, Card 2 = top authors (Open Library author photos), Card 3 = books + genres.

ASSUMPTIONS
- Data mirrors OL fields: log {key, shelf, date}, ratings {key, rating, date},
  works {key, title, authors[], author_key?, cover_id? | cover_isbn?, first_publish_year, pages?, subjects?}, goal.
- Host integration: set window.OL_RECAP_DATA = {viewer, owner, log, ratings, works, goal}. If owner !== viewer
  nothing renders (private logs). A Goodreads/StoryGraph CSV can be imported instead (parsed locally, never stored).
- Only Open Library is contacted: openlibrary.org/search.json (author keys, subjects, cover ids, page counts)
  and covers.openlibrary.org (book covers + author photos). Nothing else, nothing stored, no tracking.
- GENRES are a best guess: OL subjects are free-text, so a small keyword table maps them to broad genres.
  The first matching rule wins, and books with no usable subjects simply show no genre chip.
- "Books read" = Already Read entries whose log date is in the chosen year.
- Everything is drawn on canvas (1080 wide) so exported PNGs match the preview. Missing covers/photos
  become neutral placeholders (never tinted). If a canvas ever taints, export retries without remote images.
- FLAG: window.OL_FEATURES = {readingRecap:false} skips mounting. Delete this file to remove it.
-->
<style>
:root{--bg:hsl(48,31%,84%);--ink:hsl(41,14%,21%);--mut:hsl(41,12%,36%);--panel:#fff;--line:hsl(45,22%,77%);--ctl:hsl(48,38%,97%);--ctl-h:hsl(48,32%,94%);
--btn:hsl(210,82%,40%);--btn-h:hsl(210,84%,31%);--btnink:#fff;--sel:hsl(218,65%,95%);--sel-ink:hsl(210,84%,31%);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
h1{font:700 1.5rem Georgia,"Times New Roman",serif;margin:.2em 0}
p.lead{margin:0 0 14px;color:var(--mut)}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.wrap{grid-template-columns:300px minmax(0,1fr)}header{grid-column:1/-1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;align-content:start}
fieldset{border:0;margin:0;padding:0}legend,label.l{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,.file,select,input[type=number]{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--ctl);color:var(--ink);padding:9px 12px;min-height:44px;cursor:pointer;max-width:100%}
button:hover,.file:hover{background:var(--ctl-h)}
select,input[type=number]{width:100%;background:#fff}
button[aria-pressed=true]{background:var(--sel);color:var(--sel-ink);border-color:var(--btn);font-weight:700}
button.pri{background:var(--btn);color:var(--btnink);border-color:var(--btn);font-weight:700}
button.pri:hover{background:var(--btn-h)}
:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within{outline:3px solid var(--btn);outline-offset:2px}
.stage{display:grid;gap:12px;justify-items:center;align-content:start}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
canvas{max-width:100%;max-height:74vh;width:auto;height:auto;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#status{min-height:1.4em;color:var(--mut);font-size:.9rem}
</style>
</head>
<body>
<main class="wrap" id="reading-recap">
  <header><h1>Your Reading Recap</h1><p class="lead">Three cards for your year. Built in your browser; nothing is saved or sent anywhere except Open Library lookups.</p></header>

  <section class="panel" aria-label="Card settings">
    <fieldset><legend>Format</legend>
      <div class="row" id="fmts" role="group" aria-label="Card format">
        <button data-f="story" aria-pressed="true">Story 9:16</button>
        <button data-f="feed" aria-pressed="false">Feed 4:5</button>
        <button data-f="square" aria-pressed="false">Square 1:1</button>
      </div></fieldset>
    <div><label class="l" for="theme">Theme</label><select id="theme"></select></div>
    <div><label class="l" for="yr">Year</label><select id="yr"></select></div>
    <div><label class="l" for="goal">Yearly goal (books)</label><input id="goal" type="number" min="0" max="999" inputmode="numeric" placeholder="none"></div>
    <div class="row">
      <button id="surprise" type="button">🎲 Surprise me</button>
      <label class="file">Import CSV<input id="csv" type="file" accept=".csv,text/csv"></label>
    </div>
    <div class="row">
      <button class="pri" id="share" type="button">Share all 3</button>
      <button id="dl" type="button">Download this card</button>
      <button id="dlall" type="button">Download all 3</button>
      <button id="copy" type="button">Copy link</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="stage">
    <div class="tabs" id="tabs" role="group" aria-label="Choose card">
      <button data-c="0" aria-pressed="true">1 · Progress</button>
      <button data-c="1" aria-pressed="false">2 · Authors</button>
      <button data-c="2" aria-pressed="false">3 · Genres</button>
    </div>
    <canvas id="cv" role="img" aria-label="Reading recap card"></canvas><p class="sr" id="alt"></p>
  </section>
</main>

<script>
(() => {
if (window.OL_FEATURES && window.OL_FEATURES.readingRecap === false) return; // feature flag

if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {   // older Safari/Firefox
  r = Math.min(Array.isArray(r) ? r[0] : r, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
  this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
};
const $ = s => document.querySelector(s), cv = $('#cv'), YEAR_NOW = new Date().getFullYear();
const SERIF = 'Georgia,"Iowan Old Style","Times New Roman",serif', SANS = 'system-ui,-apple-system,"Segoe UI",sans-serif';
const FMT = { story:[1080,1920], feed:[1080,1350], square:[1080,1080] };
let fmt = 'story', tab = 0, themeSel = 'auto', palOffset = 0, year = YEAR_NOW, data, A = null, tok = 0;
const by = (s, f, q) => fmt === 'story' ? s : fmt === 'feed' ? f : q;   // pick a value per format

// ---------- Themes: Open Library colour tokens remixed ----------
// bg1/bg2 gradient · ink text · accent pill/tiles/decor · hi hero number · deco background pattern
const THEMES = [

  { name:'Author Plum',   bg1:'hsl(288,25%,96%)', bg2:'hsl(288,22%,83%)', ink:'hsl(290,35%,16%)', accent:'hsl(290,30%,30%)', hi:'hsl(290,30%,28%)', card:'rgba(80,30,90,.09)',  deco:'dots' },
  { name:'Place Teal',    bg1:'hsl(184,30%,95%)', bg2:'hsl(184,27%,79%)', ink:'hsl(186,45%,13%)', accent:'hsl(186,45%,22%)', hi:'hsl(186,45%,20%)', card:'rgba(10,70,80,.09)',  deco:'waves' },
  { name:'Chart Rose',    bg1:'hsl(348,80%,97%)', bg2:'hsl(348,70%,86%)', ink:'hsl(345,60%,17%)', accent:'hsl(345,62%,40%)', hi:'hsl(345,62%,38%)', card:'rgba(150,30,70,.09)', deco:'sunburst' },
  { name:'Cream Library', bg1:'hsl(48,38%,98%)',  bg2:'hsl(47,27%,86%)',  ink:'hsl(41,14%,21%)',  accent:'hsl(13,55%,42%)',  hi:'hsl(11,58%,35%)',  card:'rgba(60,50,30,.08)',  deco:'spines' },
  { name:'Sky & Sand',    bg1:'hsl(48,38%,97%)',  bg2:'hsl(217,63%,88%)', ink:'hsl(41,14%,21%)',  accent:'hsl(36,75%,30%)',  hi:'hsl(36,75%,30%)',  card:'rgba(60,50,30,.08)',  deco:'dots' }
];
const LIGHT = THEMES.length;                                            // light themes come first; Auto only picks these
THEMES.push(
  { name:'Brand Blue Night', bg1:'hsl(214,79%,16%)', bg2:'hsl(210,82%,40%)', ink:'hsl(48,38%,97%)',  accent:'hsl(42,74%,50%)',  hi:'hsl(47,72%,78%)',  card:'rgba(255,255,255,.12)', deco:'blobs' },
  { name:'Star Gold Bold',   bg1:'hsl(42,74%,50%)',  bg2:'hsl(36,75%,42%)',  ink:'hsl(41,16%,12%)',  accent:'hsl(41,16%,12%)',  hi:'hsl(41,16%,12%)',  card:'rgba(30,20,0,.12)',     deco:'stripes' },
  { name:'Chart Pink',       bg1:'hsl(345,62%,36%)', bg2:'hsl(347,80%,50%)', ink:'hsl(0,0%,100%)',   accent:'hsl(45,83%,59%)',  hi:'hsl(45,83%,59%)',  card:'rgba(255,255,255,.14)', deco:'dots' },
  { name:'Olive Shelf',      bg1:'hsl(107,38%,15%)', bg2:'hsl(103,32%,34%)', ink:'hsl(48,38%,97%)',  accent:'hsl(42,74%,50%)',  hi:'hsl(47,72%,78%)',  card:'rgba(255,255,255,.12)', deco:'spines' },
  { name:'Brick Red',        bg1:'hsl(9,60%,24%)',   bg2:'hsl(12,80%,45%)',  ink:'hsl(0,0%,100%)',   accent:'hsl(47,72%,78%)',  hi:'hsl(47,72%,78%)',  card:'rgba(255,255,255,.14)', deco:'blobs' },
  { name:'Plum Night',       bg1:'hsl(290,32%,18%)', bg2:'hsl(288,40%,42%)', ink:'hsl(288,25%,96%)', accent:'hsl(184,60%,70%)', hi:'hsl(184,70%,78%)', card:'rgba(255,255,255,.12)', deco:'stripes' },
  { name:'Teal Night',       bg1:'hsl(186,50%,12%)', bg2:'hsl(184,50%,30%)', ink:'hsl(184,30%,95%)', accent:'hsl(46,80%,80%)',  hi:'hsl(46,80%,82%)',  card:'rgba(255,255,255,.12)', deco:'dots' },
  { name:'Midnight Ink',     bg1:'hsl(41,16%,8%)',   bg2:'hsl(214,79%,19%)', ink:'hsl(48,38%,97%)',  accent:'hsl(348,95%,65%)', hi:'hsl(348,95%,76%)', card:'rgba(255,255,255,.1)',  deco:'grid' },
  { name:'Sunset Shelf',     bg1:'hsl(345,62%,32%)', bg2:'hsl(28,88%,48%)',  ink:'hsl(0,0%,100%)',   accent:'hsl(47,72%,78%)',  hi:'hsl(47,72%,82%)',  card:'rgba(255,255,255,.14)', deco:'sunburst' }
);
const opt = (t, i) => `<option value="${i}">${t.name}</option>`;
$('#theme').innerHTML = '<option value="auto">Auto (light, made for you)</option>'
  + `<optgroup label="Light · Open Library">${THEMES.slice(0, LIGHT).map(opt).join('')}</optgroup>`
  + `<optgroup label="Bold · Dark">${THEMES.slice(LIGHT).map((t, i) => opt(t, i + LIGHT)).join('')}</optgroup>`;

// ---------- Mock data (same shape as OL fields) ----------
function mockData() {
  const d = (m, x) => `${YEAR_NOW}-${String(m).padStart(2,'0')}-${String(x).padStart(2,'0')}`;
  // id, title, author, first year, pages, isbn (for the cover), subjects, shelf, date, rating
  const R = [
    [1,'The Left Hand of Darkness','Ursula K. Le Guin',1969,304,'9780441478125',['science fiction','fiction'],'Already Read',d(1,9),5],
    [2,'Piranesi','Susanna Clarke',2020,272,'9781635575637',['fantasy','fiction'],'Already Read',d(2,3),5],
    [3,'Middlemarch','George Eliot',1871,880,'9780141439549',['english literature','classic'],'Already Read',d(3,20),4],
    [4,'Braiding Sweetgrass','Robin Wall Kimmerer',2013,391,'9781571313560',['nature','science'],'Already Read',d(4,11),5],
    [5,'The Hobbit','J.R.R. Tolkien',1937,310,'9780547928227',['fantasy','fiction'],'Already Read',d(5,2),4],
    [6,'Circe','Madeline Miller',2018,393,'9780316556347',['mythology','fantasy'],'Already Read',d(6,18),4],
    [7,'Kindred','Octavia E. Butler',1979,null,'9780807083697',['science fiction','historical fiction'],'Already Read',d(7,7),5],
    [8,'A Wizard of Earthsea','Ursula K. Le Guin',1968,183,'9780547773742',['fantasy','fiction'],'Already Read',d(2,25),5],
    [9,'The Fellowship of the Ring','J.R.R. Tolkien',1954,432,'9780547928210',['fantasy','fiction'],'Already Read',d(8,12),4],
    [10,'Pachinko','Min Jin Lee',2017,496,'9781455563937',['historical fiction'],'Currently Reading',d(9,1),0],
    [11,'A Psalm for the Wild-Built','Becky Chambers',2021,160,'9781250236210',['science fiction'],'Want to Read',d(9,5),0]
  ];
  return { viewer:'demo', owner:'demo', goal:12,
    works:R.map(r => ({ key:'mock:' + r[0], title:r[1], authors:[r[2]], cover_id:null, cover_isbn:r[5], first_publish_year:r[3], pages:r[4], subjects:r[6] })),
    log:R.map(r => ({ key:'mock:' + r[0], shelf:r[7], date:r[8] })),
    ratings:R.filter(r => r[9]).map(r => ({ key:'mock:' + r[0], rating:r[9], date:r[8] })) };
}

// ---------- CSV import (Goodreads / StoryGraph shape) ----------
function parseCSV(t) {
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i+1] === '\n') i++; r.push(f); rows.push(r); r = []; f = ''; }
    else f += c;
  }
  if (f || r.length) { r.push(f); rows.push(r); }
  return rows;
}
function fromCSV(text) {
  const [h, ...rows] = parseCSV(text), H = h.map(x => x.trim().toLowerCase());
  const g = (r, ...names) => { for (const n of names) { const i = H.indexOf(n); if (i >= 0 && r[i] && r[i].trim()) return r[i].trim(); } return ''; };
  const out = { viewer:'csv', owner:'csv', goal:null, works:[], log:[], ratings:[] };
  rows.forEach((r, i) => {
    const title = g(r, 'title'); if (!title) return;
    const s = g(r, 'exclusive shelf', 'read status').toLowerCase();
    const shelf = s === 'read' ? 'Already Read' : s === 'currently-reading' ? 'Currently Reading' : s === 'to-read' ? 'Want to Read' : null;
    if (!shelf) return;
    const key = 'csv:' + i, dt = new Date(g(r, 'date read', 'last date read', 'date added'));
    out.works.push({ key, title:title.replace(/\s*\(.*#.*\)$/, ''), authors:[g(r, 'author', 'authors').split(/,| and /)[0].trim()], cover_id:null,
      cover_isbn:[g(r, 'isbn13'), g(r, 'isbn')].map(v => v.replace(/\D/g, '')).find(Boolean) || null,
      first_publish_year:+g(r, 'original publication year', 'year published') || null, pages:+g(r, 'number of pages', 'pages') || null });
    out.log.push({ key, shelf, date:isNaN(dt) ? `${YEAR_NOW}-01-01` : dt.toISOString().slice(0,10) });
    const rt = Math.round(parseFloat(g(r, 'my rating', 'star rating')) || 0);
    if (rt > 0) out.ratings.push({ key, rating:Math.min(5, rt), date:'' });
  });
  return out;
}

// ---------- Genres: OL subjects -> broad genre (first matching rule wins) ----------
const GENRES = [
  [/science fiction|sci-fi|dystopi|space opera|cyberpunk/, 'Science Fiction'], [/fantasy|dragon|magic|mytholog|fairy/, 'Fantasy'],
  [/mystery|detective|crime|thriller|suspense/, 'Mystery & Thriller'], [/horror|ghost|gothic|supernatural/, 'Horror'],
  [/romance|love stor/, 'Romance'], [/historical fiction|historical|war stor/, 'Historical Fiction'],
  [/biograph|memoir/, 'Memoir & Biography'], [/nature|science|ecolog|botany|environment|physics|biolog/, 'Science & Nature'],
  [/history|politic|government|civiliz/, 'History'], [/philosoph|religio|spiritual|psycholog|self-help/, 'Ideas & Mind'],
  [/poetry|poems/, 'Poetry'], [/young adult|juvenile|children/, 'Young Adult'],
  [/classic|english literature|american literature|literature/, 'Classics'], [/fiction|novel|stories/, 'Fiction']
];
function genreOf(subjects) {
  if (!subjects || !subjects.length) return null;
  const s = subjects.join(' | ').toLowerCase();
  for (const [re, name] of GENRES) if (re.test(s)) return name;
  return null;
}

// ---------- Open Library lookups (the only network calls, besides cover images) ----------
async function lookup(w) {
  const real = /^\/works\/OL\d+W$/.test(w.key);
  const qs = real ? `q=key:${w.key}` : `title=${encodeURIComponent(w.title)}&author=${encodeURIComponent((w.authors || [])[0] || '')}`;
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
  try {
    const r = await fetch(`https://openlibrary.org/search.json?${qs}&limit=1&fields=author_key,author_name,subject,cover_i,first_publish_year,number_of_pages_median`, { signal:ctl.signal });
    if (!r.ok) return false;
    const d = ((await r.json()).docs || [])[0]; if (!d) return false;
    const last = s => (s || '').toLowerCase().split(/\s+/).pop();
    if (d.author_key && d.author_name && (real || last(d.author_name[0]) === last((w.authors || [])[0]))) w.author_key = d.author_key[0];  // guard against wrong-author matches
    if (d.subject && !(w.subjects && w.subjects.length)) w.subjects = d.subject.slice(0, 40);
    if (!w.cover_id && !w.cover_isbn && d.cover_i) w.cover_id = d.cover_i;
    if (!w.pages && d.number_of_pages_median) w.pages = d.number_of_pages_median;
    if (!w.first_publish_year && d.first_publish_year) w.first_publish_year = d.first_publish_year;
    return true;
  } catch (e) { return false; } finally { clearTimeout(t); w._e = 1; }
}
async function enrich() {
  const todo = buildModel().read.slice(0, 16).map(b => data.works.find(w => w.key === b.key)).filter(w => w && !w._e);
  if (!todo.length) return;
  say('Fetching author photos and genres from Open Library…'); let ok = 0;
  for (let i = 0; i < todo.length; i += 4) ok += (await Promise.all(todo.slice(i, i + 4).map(lookup))).filter(Boolean).length;
  say(ok ? 'Open Library data loaded.' : 'Couldn’t reach Open Library, so the data on hand is used.');
  refresh();
}

// ---------- Images (CORS-safe) ----------
const coverURL = b => b.cover_id ? `https://covers.openlibrary.org/b/id/${b.cover_id}-L.jpg?default=false`
  : b.cover_isbn ? `https://covers.openlibrary.org/b/isbn/${b.cover_isbn}-L.jpg?default=false` : null;     // default=false: 404 instead of a 1px placeholder
const authorURL = k => `https://covers.openlibrary.org/a/olid/${k}-L.jpg?default=false`;
const imgCache = new Map();
function loadImg(url) {
  if (!url) return Promise.resolve(null);
  if (imgCache.has(url)) return imgCache.get(url);
  const p = new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';             // required so toBlob() is allowed
    const t = setTimeout(() => res(null), 7000);
    im.onload = () => { clearTimeout(t); res(im.naturalWidth > 1 ? im : null); };
    im.onerror = () => { clearTimeout(t); res(null); };
    im.src = url;
  });
  imgCache.set(url, p); return p;
}

// ---------- Model ----------
const hash = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
function buildModel() {
  const W = new Map(data.works.map(w => [w.key, w])), R = new Map(data.ratings.map(r => [r.key, r]));
  const read = [], other = [];
  for (const e of data.log) {
    const w = W.get(e.key); if (!w) continue;
    const b = { ...w, rating:(R.get(e.key) || {}).rating || 0, date:e.date, genre:genreOf(w.subjects) };
    if (e.shelf === 'Already Read') { if (new Date(e.date).getFullYear() === year) read.push(b); } else other.push(b);
  }
  const goalIn = $('#goal').value, goal = goalIn === '' ? null : +goalIn || null;
  const wp = read.filter(b => b.pages > 0), rated = read.filter(b => b.rating > 0);
  const top = read.slice().sort((a, b) => b.rating - a.rating || new Date(b.date) - new Date(a.date)).slice(0, 5);
  const am = new Map(), gm = new Map();
  for (const b of read) {
    const name = (b.authors || [])[0];
    if (name) { const a = am.get(name) || { name, key:null, n:0, rs:0, rc:0 }; a.n++; if (b.author_key && !a.key) a.key = b.author_key; if (b.rating) { a.rs += b.rating; a.rc++; } am.set(name, a); }
    if (b.genre) gm.set(b.genre, (gm.get(b.genre) || 0) + 1);
  }
  const avgOf = a => a.rc ? a.rs / a.rc : 0;
  return {
    n:read.length, read, other, top, goal, rated:rated.length, pool:read.length ? top : other.slice(0, 5),
    authors:[...am.values()].sort((a, b) => b.n - a.n || avgOf(b) - avgOf(a)),

  const ys = [...new Set(data.log.filter(e => e.shelf === 'Already Read').map(e => new Date(e.date).getFullYear()).filter(Boolean))].sort((a, b) => b - a);
  if (!ys.includes(YEAR_NOW)) ys.unshift(YEAR_NOW);
  $('#yr').innerHTML = ys.map(y => `<option>${y}</option>`).join(''); year = ys.includes(year) ? year : ys[0]; $('#yr').value = year;
  $('#goal').value = data.goal || '';
  if (data.blocked) say('This reading log is private. Only your own recap can be shown.');
  refresh().then(enrich);
}

// Privacy guard: only ever render the viewer's own data.
data = mockData();
if (window.OL_RECAP_DATA) { const h = window.OL_RECAP_DATA; data = (h.viewer && h.owner && h.viewer !== h.owner) ? { works:[], log:[], ratings:[], goal:null, blocked:true } : h; }
setup();
})();
</script>
